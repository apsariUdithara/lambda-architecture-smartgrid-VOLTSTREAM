<title id="title">Voltstream sequence: bill request and merge</title>
<desc id="desc">The dashboard asks the API for a household's bill for day D. The API checks the run ledger for a successful run. If there is one it returns the batch row as final; otherwise it returns the speed estimate as provisional, or 404 if there is none.</desc>
