<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="title desc">
<title id="title">Voltstream: the idea in one picture</title>
<desc id="desc">Overview. Fifty simulated smart meters send a reading every 2 seconds into one Kafka stream. A fast path, the speed layer, adds the readings up within seconds but uses yesterday's prices and skips readings that arrive very late, so its bill is an estimate. Every reading is also kept unchanged in a raw copy. Once a day ends and that day's price list arrives, a slow path, the batch layer, re-reads every reading of the day with the right prices and produces the exact bill. The API gives one answer: the exact bill if it is ready, otherwise the estimate, and the dashboard shows a Provisional or Final badge.</desc>
<defs><marker id="ah-final-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#72a2ec"/></marker><marker id="ah-muted-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa6bc"/></marker><marker id="ah-provisional-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e6a743"/></marker><marker id="ah-simulated-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ad8eec"/></marker></defs>
