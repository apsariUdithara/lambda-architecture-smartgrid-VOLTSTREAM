<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
<title id="title">Voltstream fault handling</title>
<desc id="desc">How each layer treats bad data. The archive keeps everything. Null fields, negative kWh and unknown households are rejected by both layers. Out-of-order readings are counted and duplicates removed by both. Late readings are dropped by the speed layer but counted by the batch layer: the data effect. The speed layer prices with the previous day's tariff: the tariff effect. Estimate minus final equals the two.</desc>
