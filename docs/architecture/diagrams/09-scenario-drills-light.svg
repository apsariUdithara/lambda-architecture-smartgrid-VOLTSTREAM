<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="title desc">
<title id="title">Voltstream scenario: the five alert drills</title>
<desc id="desc">Timeline of the five alert drills in scripts/inject_faults.sh, in real minutes. stale stops meter-producer; MeterDataStale fires for all five zones after about 3 minutes and the drill takes about 4. rejects restarts the producer with 15 percent null fields; HighRejectRate fires after about 2 minutes, about 3 in total. renewable changes nothing and waits for simulated dusk, when LowRenewableContribution fires for all five zones, up to 7 minutes. sla pauses the daily_billing DAG; BatchSLAMiss fires 15 minutes after the last billing, 15 to 17 minutes in total. divergence makes 60 percent of readings 3 to 5 simulated hours late; LambdaDivergenceHigh fires after 8 to 13 minutes. Every drill undoes its change on any exit; running all of them overlaps the SLA wait with the first three, about 30 minutes.</desc>
