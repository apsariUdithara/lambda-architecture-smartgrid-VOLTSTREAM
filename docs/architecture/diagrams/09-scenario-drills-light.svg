<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="430" viewBox="0 0 1140 430" role="img" aria-labelledby="title desc">
<title id="title">Voltstream scenario: alert drills</title>
<desc id="desc">Five drills on a timeline in minutes: stopping the producer fires MeterDataStale at about 3, invalid readings fire HighRejectRate at about 2, night fires LowRenewableContribution within 7, pausing billing fires BatchSLAMiss at 15, and late readings fire LambdaDivergenceHigh between 8 and 13.</desc>
