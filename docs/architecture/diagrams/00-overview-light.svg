<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="470" viewBox="0 0 1260 470" role="img" aria-labelledby="title desc">
<title id="title">Voltstream system overview</title>
<desc id="desc">Simulated smart meters publish readings to a Kafka event stream. The speed layer turns them into estimates within seconds; a raw archive keeps every reading, which the batch layer replays once a day with that day's tariff to produce exact bills. Both write to a PostgreSQL serving database, read by the API and dashboard.</desc>
