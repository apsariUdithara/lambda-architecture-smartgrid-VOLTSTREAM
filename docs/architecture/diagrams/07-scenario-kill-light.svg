<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">Voltstream scenario: crash the speed layer</title>
<desc id="desc">Scenario diagram for the kill test, scripts/smoke_test.sh kill-speed-layer. The speed layer is killed with SIGKILL for 60 seconds. Meanwhile the raw archiver keeps consuming into the raw copy, the live zone view goes stale, and the final bill of an already billed day is served unchanged. After a restart the speed layer resumes from its checkpoint and catches up until the view is under 30 seconds old with zero consumer lag. When the day of the kill closes it is billed in full from the raw copy: 50 bills, and readings at least 95 percent of the day before. Losing the speed layer costs freshness, never correctness.</desc>
