<text x="24.0" y="61.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4e5a71" text-anchor="start">scripts/backfill.sh: a wrong price list is fixed by re-running the day, not by editing bills. Each run is a new Airflow run of the same DAG.</text>
