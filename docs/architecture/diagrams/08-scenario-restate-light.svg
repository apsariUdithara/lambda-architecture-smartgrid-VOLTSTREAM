<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
<title id="title">Voltstream scenario: restate a day</title>
<desc id="desc">Scenario diagram for scripts/backfill.sh, restating an already billed day D. The script corrupts block_1_rate by 45.00 in every row of tariff_D.csv and runs billing again as billing__D__r1: all 50 bills change, the original run becomes superseded and r1 becomes success. It then restores the original file and runs billing__D__r2: all 50 wrong bills are replaced, r1 becomes superseded and r2 success. household_bill_daily, which the API serves, holds only the latest bills, while household_bill_history keeps all three sets. The original tariff file is restored on any exit.</desc>
