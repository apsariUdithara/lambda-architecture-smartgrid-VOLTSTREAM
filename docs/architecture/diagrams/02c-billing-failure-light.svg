<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" role="img" aria-labelledby="title desc">
<title id="title">Voltstream sequence: billing failure and retry</title>
<desc id="desc">A billing attempt marks the ledger running, fails, marks it failed and exits 1. Airflow retries up to twice with backoff; a successful retry commits bills and a success row. Until then the API keeps returning the speed estimate, and if no run succeeds for 15 minutes Prometheus fires BatchSLAMiss.</desc>
