<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="630" viewBox="0 0 1280 630" role="img" aria-labelledby="title desc">
<title id="title">Voltstream: which bill GET /bill returns</title>
<desc id="desc">Two state machines. Left: a pipeline_runs row for one billing attempt (layer batch_billing) starts running, then becomes success when finalise commits, or failed on an exception or when the next attempt finds it abandoned; a success becomes superseded when a later restatement commits, in the same transaction, and a partial unique index allows at most one success per day. Right: what GET /api/v1/households/{id}/bill returns for a day. It starts at 404, becomes provisional (the speed row, priced with the previous day's tariff) after the first household micro-batch, and becomes final (the batch row) once a success row exists. A restatement keeps it final with new figures. No transition leaves final.</desc>
