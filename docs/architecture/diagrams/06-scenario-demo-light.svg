<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">Voltstream scenario: provisional to final</title>
<desc id="desc">Scenario diagram for scripts/demo.sh. While day D is open, a bill request for HH-0001 is answered by the speed layer: source speed, provisional true, priced with day D−1's tariff, and the dashboard badge reads Provisional. At simulated midnight D closes; within about two minutes the batch layer waits out the 90-second grace, rescans the day and commits the bills. The same request is then answered by the batch layer: source batch, provisional false, tariff of day D, badge Final. The bill/delta endpoint then shows the estimate, the final bill and the gap split into tariff effect and data effect.</desc>
<defs></defs>
<rect width="1280" height="640" fill="#f6f8fb"/>
<text x="24.0" y="38.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="650" fill="#172033" text-anchor="start">Scenario · Provisional → final   (voltstream.ps1 demo · make demo)</text>
<text x="24.0" y="61.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4e5a71" text-anchor="start">scripts/demo.sh asks for the same household's bill for the same day twice: before and after the day is billed. Numbers are the script's own steps.</text>
