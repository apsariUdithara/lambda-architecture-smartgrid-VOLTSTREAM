<title id="title">Voltstream scenario: restate a day</title>
<desc id="desc">A billed day is re-run with a corrupted tariff, giving wrong bills, then re-run with the correct tariff, giving corrected bills. Each re-run supersedes the last in the run ledger, and the history keeps every run's bills.</desc>
