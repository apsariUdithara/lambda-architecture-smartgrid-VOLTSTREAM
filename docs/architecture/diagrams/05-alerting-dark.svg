<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="540" viewBox="0 0 1140 540" role="img" aria-labelledby="title desc">
<title id="title">Voltstream monitoring and alerting</title>
<desc id="desc">Prometheus scrapes service metrics, a Pushgateway for batch jobs and an SQL exporter for PostgreSQL, and evaluates five alert rules. Alertmanager routes them to the API webhook, which writes logs; no pager or email is configured. Grafana queries Prometheus for three dashboards.</desc>
