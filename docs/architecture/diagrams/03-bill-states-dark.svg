<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Voltstream bill lifecycle</title>
<desc id="desc">Two state machines. A billing run goes from running to succeeded on commit or to failed on error; a succeeded run becomes superseded when the day is restated. The bill served for a day goes from not found to provisional on the first estimate, and to final once a run has succeeded; restating keeps it final.</desc>
