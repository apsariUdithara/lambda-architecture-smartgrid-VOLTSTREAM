<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
<title id="title">Voltstream scenario: provisional to final</title>
<desc id="desc">While day D is open the speed layer estimates it and the bill is provisional. After midnight the batch layer bills and reconciles D, and the bill is final.</desc>
<defs></defs>
<rect width="1200" height="370" fill="#0e131b"/>
<text x="24.0" y="36.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="650" fill="#e3e9f2" text-anchor="start">Scenario · provisional → final</text>
<text x="395.0" y="82.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#9aa6bc" text-anchor="middle">Day D open</text>
<text x="694.0" y="82.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#9aa6bc" text-anchor="middle">Day D closes</text>
<text x="1002.0" y="82.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#9aa6bc" text-anchor="middle">Next day</text>
<rect x="24.0" y="100.0" width="1152.0" height="58.0" rx="8" fill="#172030"/>
<text x="40.0" y="134.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="650" fill="#e3e9f2" text-anchor="start">Speed layer</text>
<rect x="24.0" y="170.0" width="1152.0" height="58.0" rx="8" fill="#172030"/>
<text x="40.0" y="204.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="650" fill="#e3e9f2" text-anchor="start">Batch layer</text>
<rect x="24.0" y="240.0" width="1152.0" height="58.0" rx="8" fill="#172030"/>
<text x="40.0" y="274.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="650" fill="#e3e9f2" text-anchor="start">GET bill (D)</text>
<line x1="564" y1="66" x2="564" y2="304" stroke="#38465e" stroke-dasharray="2 4"/>
<line x1="824" y1="66" x2="824" y2="304" stroke="#38465e" stroke-dasharray="2 4"/>
<rect x="230.0" y="110.0" width="326.0" height="38.0" rx="6" fill="#352e22" stroke="#e6a743" stroke-width="1.3"/>
<text x="393.0" y="134.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#e3e9f2" text-anchor="middle">estimating D</text>
<rect x="568.0" y="110.0" width="608.0" height="38.0" rx="6" fill="#352e22" stroke="#e6a743" stroke-width="1.3"/>
<text x="872.0" y="134.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#e3e9f2" text-anchor="middle">estimating D+1</text>
<rect x="230.0" y="180.0" width="326.0" height="38.0" rx="6" fill="#0e131b" stroke="#6b7890" stroke-width="1.3" stroke-dasharray="5 4"/>
