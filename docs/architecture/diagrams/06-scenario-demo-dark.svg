<rect x="576.0" y="180.0" width="236.0" height="38.0" rx="6" fill="#202d41" stroke="#72a2ec" stroke-width="1.3"/>
<text x="694.0" y="204.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#e3e9f2" text-anchor="middle">rescan · bill D</text>
<rect x="836.0" y="180.0" width="164.0" height="38.0" rx="6" fill="#202d41" stroke="#72a2ec" stroke-width="1.3"/>
<text x="918.0" y="204.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#e3e9f2" text-anchor="middle">reconcile</text>
<rect x="230.0" y="250.0" width="326.0" height="38.0" rx="6" fill="#352e22" stroke="#e6a743" stroke-width="1.3"/>
