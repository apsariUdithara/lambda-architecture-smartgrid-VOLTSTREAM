<rect x="836.0" y="250.0" width="340.0" height="38.0" rx="6" fill="#202d41" stroke="#72a2ec" stroke-width="1.3"/>
<text x="1006.0" y="274.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#e3e9f2" text-anchor="middle">Final</text>
<line x1="564" y1="66" x2="564" y2="310" stroke="#e3e9f2" stroke-width="2"/>
<rect x="538.0" y="319.5" width="52.0" height="15.5" rx="3" fill="#0e131b"/>
<text x="564.0" y="330.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#e3e9f2" text-anchor="middle">midnight</text>
<rect x="24.0" y="339.0" width="22.0" height="14.0" rx="3" fill="#352e22" stroke="#e6a743" stroke-width="1.2"/>
<text x="53.0" y="350.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9aa6bc" text-anchor="start">speed · provisional</text>
<rect x="191.0" y="339.0" width="22.0" height="14.0" rx="3" fill="#202d41" stroke="#72a2ec" stroke-width="1.2"/>
<text x="220.0" y="350.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9aa6bc" text-anchor="start">batch · final</text>
<rect x="320.7" y="339.0" width="22.0" height="14.0" rx="3" fill="#172030" stroke="#38465e" stroke-width="1.2"/>
<text x="349.7" y="350.0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9aa6bc" text-anchor="start">infrastructure</text>
